[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-search"
version = "0.1.0"
description = "Semantic search + RAG over arXiv cs.IR / cs.CL / cs.LG abstracts (DSBA 6188)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2",
    "PyStemmer>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "rank-bm25>=0.2"]  # rank-bm25 only to cross-check our own BM25 in tests
experiments = ["beautifulsoup4>=4.12", "tokenizers>=0.19", "sentence-transformers>=3", "openpyxl>=3.1", "tiktoken>=0.9"]  # openpyxl: human grading sheet

[tool.setuptools.packages.find]
include = ["arxiv_search*"]  # only the arxiv_search/ folder is the installable package

[tool.pytest.ini_options]
testpaths = ["tests"]
