<!doctype html>
<html><head><meta charset="utf-8">
<!-- Matches agarwal-labs.com: paper background, serif type, green links, hairline rules. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
    color: #272b29; background: #fdfdfc;
    padding: 84px 110px 0; box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 92px; font-weight: 500; line-height: 1.1; margin: 0; }
  .role { font-size: 34px; line-height: 1.45; margin: 18px 0 0; max-width: 960px; }
  .by { font-size: 26px; color: #656c68; margin: 14px 0 0; }
  .rule { border-top: 2px solid #dfe3df; margin: 40px 0 42px; }
  .search { display: flex; gap: 18px; }
  .input { flex: 1; border: 2px solid #b9c0bb; border-radius: 6px; padding: 18px 26px; font-size: 30px; color: #656c68; }
  .btn { border: 2px solid #285b4c; border-radius: 6px; padding: 18px 30px; font-size: 30px; color: #285b4c; }
  .url { position: absolute; right: 110px; bottom: 40px; font-size: 24px; color: #285b4c;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
</style></head>
<body>
  <h1>arXiv Search</h1>
  <p class="role">23,304 recent papers in IR, NLP and ML, with AI-reranked results and a cited summary.</p>
  <p class="by">A project by Sid Agarwal</p>
  <div class="rule"></div>
  <div class="search">
    <div class="input">LLM reranking for search</div>
    <div class="btn">Search</div>
  </div>
  <div class="url">arxiv.agarwal-labs.com</div>
</body></html>
