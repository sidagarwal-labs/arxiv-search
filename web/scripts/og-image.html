<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, "Segoe UI", sans-serif; color: #18181b;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(168,85,247,.18), transparent 60%),
      radial-gradient(800px 500px at 0% 110%, rgba(79,70,229,.16), transparent 60%),
      #fafafa;
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; color: #3f3f46; }
  .mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,#4f46e5,#a855f7); }
  h1 { font-size: 76px; line-height: 1.05; letter-spacing: -0.035em; margin: 34px 0 18px; font-weight: 700; }
  h1 span { background: linear-gradient(90deg,#4f46e5,#a855f7); -webkit-background-clip: text; color: transparent; }
  p { font-size: 28px; color: #52525b; margin: 0 0 44px; max-width: 900px; line-height: 1.4; }
  .bar { display: flex; align-items: center; gap: 18px; background: #fff; border: 1px solid #e4e4e7; border-radius: 20px;
    padding: 22px 26px; box-shadow: 0 12px 32px rgba(79,70,229,.12); width: 860px; font-size: 26px; color: #71717a; }
  .bar svg { width: 30px; height: 30px; fill: none; stroke: #a1a1aa; stroke-width: 2.2; stroke-linecap: round; }
  .go { margin-left: auto; width: 48px; height: 48px; border-radius: 14px; background: #4f46e5; display: grid; place-items: center; }
  .go svg { stroke: #fff; width: 24px; height: 24px; }
  .url { position: absolute; right: 96px; bottom: 48px; font-size: 22px; color: #71717a; }
</style></head>
<body>
  <div class="brand"><div class="mark"></div>arXiv Search</div>
  <h1>Find recent research, <span>fast</span>.</h1>
  <p>23,304 recent papers in IR, NLP and ML. AI-reranked results with a cited summary.</p>
  <div class="bar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    reducing hallucination in retrieval-augmented generation
    <div class="go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>
  <div class="url">arxiv.agarwal-labs.com</div>
</body></html>
